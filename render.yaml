services:
  - type: web
    name: coursebox
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: COURSEBOX_ENV
        value: production
      - key: COURSEBOX_TRUST_PROXY
        value: "true"
      - key: COURSEBOX_ADMIN_USERNAME
        value: admin
      - key: COURSEBOX_ADMIN_PASSWORD
        generateValue: true
      - key: COURSEBOX_DB
        value: data/coursebox.db
      - key: COURSEBOX_UPLOAD_DIR
        value: uploads
