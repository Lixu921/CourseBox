name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态检查与测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # 测试自行用 monkeypatch 指定临时库与上传目录，这里只固定运行环境。
      COURSEBOX_ENV: development
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: python -m ruff check .

      - name: 运行测试
        if: matrix.python-version != '3.14'
        run: python -m pytest -q

      # 覆盖率只在最新的解释器上算一次：它是代码属性，跟 3.11/3.12/3.13/3.14 无关，
      # 每个版本各跑一遍只是白烧时间。实测 91%，门槛取 90%。
      - name: 运行测试并检查覆盖率门槛
        if: matrix.python-version == '3.14'
        run: |
          python -m pytest -q \
            --cov=app --cov-report=term-missing --cov-fail-under=90
