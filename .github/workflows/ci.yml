name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态检查与测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # 测试自行用 monkeypatch 指定临时库与上传目录，这里只固定运行环境。
      COURSEBOX_ENV: development
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: python -m ruff check .

      - name: 运行测试
        if: matrix.python-version != '3.14'
        run: python -m pytest -q

      # 覆盖率只在最新的解释器上算一次：它是代码属性，跟 3.11/3.12/3.13/3.14 无关，
      # 每个版本各跑一遍只是白烧时间。实测 91%，门槛取 90%。
      - name: 运行测试并检查覆盖率门槛
        if: matrix.python-version == '3.14'
        run: |
          python -m pytest -q \
            --cov=app --cov-report=term-missing --cov-fail-under=90

      # 依赖安全扫描只在 3.14 腿跑一次。先以「只报告不阻断」的方式接入，避免上游
      # 传递依赖刚披露的 CVE 直接把所有人的 CI 打红；稳定后再收紧为阻断。
      - name: 依赖安全扫描
        if: matrix.python-version == '3.14'
        continue-on-error: true
        run: python -m pip_audit

  smoke:
    name: 真实服务冒烟
    runs-on: ubuntu-latest
    env:
      COURSEBOX_ENV: development
      COURSEBOX_ADMIN_PASSWORD: smoke-test-password
      COURSEBOX_DB: data/smoke.db
      COURSEBOX_UPLOAD_DIR: uploads
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 准备 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # 起真实 uvicorn 再打一遍接口：TestClient 会绕过真实的中间件顺序与路由匹配，
      # 历史上的批量审核 422、分块请求体 413 都是只在真实服务上才暴露的。
      - name: 启动服务并等待就绪
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/api/health > /dev/null; then
              echo "服务已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "服务未在 30 秒内就绪" >&2
          exit 1

      - name: 冒烟
        run: python scripts/smoke.py --base-url http://127.0.0.1:8001
