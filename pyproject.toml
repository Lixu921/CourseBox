[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursebox"
version = "1.0.0"
description = "课盒子课程资料共享平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette>=0.46.0,<2.0.0",
    "python-multipart==0.0.32",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 显式声明导入路径："." 让 tests 能 import app，"tests" 让各测试文件能
# from conftest import ...。不依赖 pytest 隐式的 sys.path 插入，也不依赖
# 调用方式是 python -m pytest 还是 pytest。
pythonpath = [".", "tests"]
# 覆盖率门槛放在 CI 里显式传参（见 .github/workflows/ci.yml），
# 不写进 addopts：本地没装 pytest-cov 时不该连测试都跑不起来。
# 当前实测 91%，门槛取 90% 留一点余量。

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = [
    # FastAPI 依赖注入必须写成默认参数 Depends()/Query()/File()，这是框架约定。
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# 测试代码里断言、固定口令和拼接 SQL 都是正常写法。
"tests/*" = ["S101", "S105", "S608"]
