[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursebox"
version = "1.0.0"
description = "课盒子课程资料共享平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette>=0.46.0,<2.0.0",
    "python-multipart==0.0.32",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = [
    # FastAPI 依赖注入必须写成默认参数 Depends()/Query()/File()，这是框架约定。
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# 测试代码里断言、固定口令和拼接 SQL 都是正常写法。
"tests/*" = ["S101", "S105", "S608"]
