<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程资料 · 课盒子</title>
  <link rel="icon" href="/资源/图标.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/资源/样式.css?v={{asset_version}}">
</head>
<body>
  <header class="site-header" id="top">
    <div class="shell header-inner">
      <a class="brand" href="/">课盒子</a>
      <span class="header-note">课程资料共享</span>
      <nav class="top-nav" aria-label="页面导航">
        <a href="/">首页</a>
        <a href="#top">回到顶部</a>
      </nav>
      <div class="auth-area">
        <span id="auth-status" class="auth-status">未登录</span>
        <button id="login-toggle" class="text-button" type="button">登录</button>
        <button id="password-toggle" class="text-button" type="button" hidden>修改密码</button>
        <button id="logout-button" class="text-button" type="button" hidden>退出</button>
      </div>
    </div>
  </header>
  <main class="shell page-content course-page">
    <section id="login-panel" class="auth-panel" hidden aria-labelledby="login-heading">
      <div class="section-heading">
        <h2 id="login-heading">登录账户</h2>
      </div>
      <form id="login-form" class="inline-form">
        <div class="form-field">
          <label for="login-username">用户名</label>
          <input id="login-username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="login-password">密码</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="primary-button compact-button" type="submit">登录</button>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section id="password-panel" class="auth-panel" hidden aria-labelledby="password-heading">
      <div class="section-heading">
        <h2 id="password-heading">修改密码</h2>
        <span class="muted">改完密码后，其它设备上的登录会被退出</span>
      </div>
      <form id="password-form" class="inline-form">
        <div class="form-field">
          <label for="password-current">当前密码</label>
          <input id="password-current" name="current_password" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-field">
          <label for="password-new">新密码</label>
          <input id="password-new" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-field">
          <label for="password-confirm">确认新密码</label>
          <input id="password-confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="primary-button compact-button" type="submit">保存</button>
        <p id="password-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <a class="back-link" href="/">← 返回课程列表</a>
    <section class="page-intro course-intro">
      <p class="eyebrow">课程资料</p>
      <h1 id="course-name">正在加载课程...</h1>
      <p id="course-context" class="intro-copy">课程资料共享</p>
      <div id="course-actions" class="record-actions" hidden></div>
    </section>

    <div class="course-layout">
      <section class="upload-panel" aria-labelledby="upload-heading">
        <div class="section-heading">
          <h2 id="upload-heading">上传资料</h2>
        </div>
        <form id="upload-form">
          <div class="form-field">
            <label for="file-title">资料标题</label>
            <input id="file-title" name="title" type="text" maxlength="200" placeholder="例如：第三章课件" required>
          </div>
          <div class="form-field">
            <label for="file-input">选择文件</label>
            <div id="drop-zone" class="drop-zone">
              <input id="file-input" name="file" type="file" multiple>
              <p class="drop-hint">把文件拖到这里，或点击选择（可多选）</p>
            </div>
            <p id="file-selection" class="form-hint">单个文件大小以服务端限制为准。</p>
          </div>
          <p id="upload-quota" class="form-hint" hidden></p>
          <button id="upload-button" class="primary-button" type="submit">上传资料</button>
          <progress id="upload-progress" max="100" value="0" hidden></progress>
          <p id="upload-progress-label" class="form-hint" hidden>准备上传</p>
          <ul id="upload-results" class="upload-results" aria-live="polite"></ul>
          <p id="upload-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p id="upload-access-note" class="form-hint" hidden></p>
      </section>

      <section class="files-section" aria-labelledby="files-heading">
        <div class="section-heading">
          <h2 id="files-heading">资料列表</h2>
          <span id="file-count" class="muted"></span>
        </div>
        <div id="file-toolbar" class="file-toolbar" hidden>
          <label class="checkbox-field">
            <input id="file-select-all" type="checkbox">
            <span>全选本页</span>
          </label>
          <span id="file-selection-count" class="muted"></span>
          <button id="archive-selected" class="text-button" type="button" disabled>打包下载选中</button>
          <button id="batch-approve" class="text-button review-button" type="button" disabled hidden>批量通过</button>
          <button id="batch-reject" class="text-button danger-button" type="button" disabled hidden>批量拒绝</button>
          <button id="archive-all" class="text-button" type="button">打包下载整门课</button>
          <button id="export-files" class="text-button" type="button">导出清单 CSV</button>
        </div>
        <p id="export-message" class="form-message" aria-live="polite"></p>
        <ul id="file-list" class="file-list" aria-live="polite">
          <li class="state-message">正在加载资料...</li>
        </ul>
        <nav id="file-pagination" class="pagination" aria-label="资料分页"></nav>
      </section>
    </div>
  </main>
  <div id="preview-dialog" class="preview-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="preview-backdrop" data-preview-close></div>
    <div class="preview-panel">
      <div class="preview-header">
        <h2 id="preview-title">资料预览</h2>
        <div class="preview-actions">
          <a id="preview-download" class="download-link" href="#" download>下载</a>
          <button id="preview-close" class="text-button" type="button">关闭</button>
        </div>
      </div>
      <div id="preview-body" class="preview-body"></div>
    </div>
  </div>
  <div id="comment-dialog" class="preview-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="comment-title">
    <div class="preview-backdrop" data-comment-close></div>
    <div class="preview-panel comment-panel">
      <div class="preview-header">
        <h2 id="comment-title">评论</h2>
        <button id="comment-close" class="text-button" type="button">关闭</button>
      </div>
      <div class="comment-body">
        <p id="comment-hint" class="form-hint" hidden></p>
        <form id="comment-form" class="comment-form">
          <label class="sr-only" for="comment-input">发表评论</label>
          <textarea id="comment-input" maxlength="2000" rows="3" placeholder="说点什么…"></textarea>
          <button id="comment-submit" class="primary-button compact-button" type="submit">发表</button>
        </form>
        <p id="comment-message" class="form-message" role="status" aria-live="polite"></p>
        <ul id="comment-list" class="comment-list" aria-live="polite">
          <li class="state-message">正在加载评论...</li>
        </ul>
      </div>
    </div>
  </div>
  <script src="/资源/脚本.js?v={{asset_version}}"></script>
  <script src="/资源/脚本2.js?v={{asset_version}}"></script>
  <script src="/资源/脚本3.js?v={{asset_version}}"></script>
</body>
</html>
