<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课盒子 · 课程资料共享</title>
  <link rel="icon" href="/资源/图标.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/资源/样式.css?v={{asset_version}}">
</head>
<body>
  <header class="site-header" id="top">
    <div class="shell header-inner">
      <a class="brand" href="/">课盒子</a>
      <span class="header-note">课程资料共享</span>
      <nav class="top-nav" aria-label="页面导航">
        <a href="/">首页</a>
        <a href="#top">回到顶部</a>
      </nav>
      <div class="auth-area">
        <span id="auth-status" class="auth-status">未登录</span>
        <button id="login-toggle" class="text-button" type="button">登录</button>
        <button id="logout-button" class="text-button" type="button" hidden>退出</button>
      </div>
    </div>
  </header>
  <main class="shell page-content">
    <section id="login-panel" class="auth-panel" hidden aria-labelledby="login-heading">
      <div class="section-heading">
        <h2 id="login-heading">登录账户</h2>
      </div>
      <form id="login-form" class="inline-form">
        <div class="form-field">
          <label for="login-username">用户名</label>
          <input id="login-username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="login-password">密码</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="primary-button compact-button" type="submit">登录</button>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <p id="auth-hint" class="auth-hint" role="status">
      当前是访客浏览模式：登录后可以上传资料、在「我的上传」里跟踪审核进度；管理员登录后还能管理用户。
      <button id="auth-hint-login" class="text-button" type="button">立即登录</button>
    </p>
    <section class="page-intro">
      <p class="eyebrow">课程资料库</p>
      <h1>找到下一份学习资料</h1>
      <p class="intro-copy">按课程浏览课件、习题与复习资料。</p>
    </section>
    <form id="search-form" class="search-bar" role="search">
      <label class="sr-only" for="search-input">搜索课程或资料</label>
      <input id="search-input" name="关键词" type="search" placeholder="搜索课程或资料" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
    <div id="search-filters" class="search-filters" role="group" aria-label="搜索筛选">
      <div class="filter-field">
        <label for="search-course">课程</label>
        <select id="search-course">
          <option value="">全部课程</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="search-type">类型</label>
        <select id="search-type">
          <option value="">全部类型</option>
          <option value="pdf">PDF</option>
          <option value="docx">Word（docx）</option>
          <option value="doc">Word（doc）</option>
          <option value="pptx">PPT（pptx）</option>
          <option value="ppt">PPT（ppt）</option>
          <option value="xlsx">Excel（xlsx）</option>
          <option value="xls">Excel（xls）</option>
          <option value="zip">ZIP</option>
          <option value="rar">RAR</option>
          <option value="7z">7Z</option>
          <option value="txt">TXT</option>
          <option value="md">Markdown</option>
          <option value="csv">CSV</option>
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
          <option value="jpeg">JPEG</option>
          <option value="gif">GIF</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="search-start">起始日期</label>
        <input id="search-start" type="date">
      </div>
      <div class="filter-field">
        <label for="search-end">结束日期</label>
        <input id="search-end" type="date">
      </div>
      <div class="filter-field">
        <label for="search-sort">排序</label>
        <select id="search-sort">
          <option value="newest">最新上传</option>
          <option value="oldest">最早上传</option>
          <option value="name">按标题</option>
          <option value="size">按大小</option>
        </select>
      </div>
      <button id="search-reset" class="text-button" type="button">重置筛选</button>
    </div>
    <section id="admin-course-panel" class="admin-panel" hidden aria-labelledby="admin-course-heading">
      <div class="section-heading">
        <h2 id="admin-course-heading">创建课程</h2>
        <span class="muted">管理员</span>
      </div>
      <form id="course-create-form" class="course-create-form">
        <div class="form-field">
          <label for="course-create-name">课程名称</label>
          <input id="course-create-name" name="name" type="text" maxlength="200" required>
        </div>
        <div class="form-field">
          <label for="course-create-college">学院</label>
          <input id="course-create-college" name="college" type="text" maxlength="120">
        </div>
        <div class="form-field">
          <label for="course-create-semester">学期</label>
          <input id="course-create-semester" name="semester" type="text" maxlength="80">
        </div>
        <button class="primary-button compact-button" type="submit">创建课程</button>
        <p id="course-create-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section id="admin-user-panel" class="admin-panel" hidden aria-labelledby="admin-user-heading">
      <div class="section-heading">
        <h2 id="admin-user-heading">用户管理</h2>
        <span class="muted">管理员</span>
      </div>
      <form id="user-create-form" class="user-create-form">
        <div class="form-field">
          <label for="user-create-username">用户名</label>
          <input id="user-create-username" name="username" type="text" minlength="3" maxlength="80" autocomplete="off" required>
        </div>
        <div class="form-field">
          <label for="user-create-password">初始密码</label>
          <input id="user-create-password" name="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
        </div>
        <div class="form-field">
          <label for="user-create-role">角色</label>
          <select id="user-create-role" name="role">
            <option value="viewer">浏览者</option>
            <option value="uploader">上传者</option>
            <option value="admin">管理员</option>
          </select>
        </div>
        <button class="primary-button compact-button" type="submit">创建用户</button>
        <p id="user-create-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <div class="user-toolbar">
        <label class="sr-only" for="user-filter-keyword">按用户名筛选</label>
        <input id="user-filter-keyword" type="search" placeholder="按用户名筛选" autocomplete="off">
        <label class="sr-only" for="user-filter-role">按角色筛选</label>
        <select id="user-filter-role">
          <option value="">全部角色</option>
          <option value="admin">管理员</option>
          <option value="uploader">上传者</option>
          <option value="viewer">浏览者</option>
        </select>
        <button id="user-filter-button" class="text-button" type="button">筛选</button>
      </div>
      <ul id="user-list" class="user-list" aria-live="polite">
        <li class="state-message">正在加载用户...</li>
      </ul>
      <nav id="user-pagination" class="pagination" aria-label="用户分页"></nav>
    </section>
    <section id="audit-panel" class="admin-panel" hidden aria-labelledby="audit-heading">
      <div class="section-heading">
        <h2 id="audit-heading">操作记录</h2>
        <span class="muted">管理员</span>
      </div>
      <div class="user-toolbar">
        <label class="sr-only" for="audit-filter-keyword">按操作人或详情筛选</label>
        <input id="audit-filter-keyword" type="search" placeholder="按操作人或详情筛选" autocomplete="off">
        <label class="sr-only" for="audit-filter-action">按动作筛选</label>
        <select id="audit-filter-action">
          <option value="">全部动作</option>
          <option value="create">新建</option>
          <option value="update">修改</option>
          <option value="delete">删除</option>
          <option value="download">下载</option>
          <option value="preview">预览</option>
          <option value="login">登录</option>
          <option value="logout">退出登录</option>
          <option value="reset_password">重置密码</option>
          <option value="restore">从回收站恢复</option>
          <option value="purge">彻底删除</option>
          <option value="approved">审核通过</option>
          <option value="rejected">审核拒绝</option>
        </select>
        <label class="sr-only" for="audit-filter-entity">按对象筛选</label>
        <select id="audit-filter-entity">
          <option value="">全部对象</option>
          <option value="course">课程</option>
          <option value="file">资料</option>
          <option value="user">用户</option>
        </select>
        <button id="audit-filter-button" class="text-button" type="button">筛选</button>
      </div>
      <ul id="audit-list" class="user-list" aria-live="polite">
        <li class="state-message">正在加载操作记录...</li>
      </ul>
      <nav id="audit-pagination" class="pagination" aria-label="操作记录分页"></nav>
    </section>
    <section id="trash-panel" class="admin-panel" hidden aria-labelledby="trash-heading">
      <div class="section-heading">
        <h2 id="trash-heading">回收站</h2>
        <span class="muted">删除的资料会在这里保留一段时间，期间可以恢复</span>
      </div>
      <div class="user-toolbar">
        <label class="sr-only" for="trash-filter-keyword">按标题、文件名、课程或删除人筛选</label>
        <input id="trash-filter-keyword" type="search" placeholder="按标题、文件名、课程或删除人筛选" autocomplete="off">
        <button id="trash-filter-button" class="text-button" type="button">筛选</button>
      </div>
      <ul id="trash-list" class="user-list" aria-live="polite">
        <li class="state-message">正在加载回收站...</li>
      </ul>
      <nav id="trash-pagination" class="pagination" aria-label="回收站分页"></nav>
    </section>
    <section id="my-uploads-panel" class="admin-panel" hidden aria-labelledby="my-uploads-heading">
      <div class="section-heading">
        <h2 id="my-uploads-heading">我的上传</h2>
        <span id="my-uploads-count" class="muted"></span>
      </div>
      <div class="user-toolbar">
        <label class="sr-only" for="my-uploads-status">按审核状态筛选</label>
        <select id="my-uploads-status">
          <option value="">全部状态</option>
          <option value="pending">待审核</option>
          <option value="approved">已通过</option>
          <option value="rejected">已拒绝</option>
        </select>
        <button id="my-uploads-refresh" class="text-button" type="button">刷新</button>
      </div>
      <ul id="my-uploads-list" class="file-list" aria-live="polite">
        <li class="state-message">正在加载...</li>
      </ul>
      <nav id="my-uploads-pagination" class="pagination" aria-label="我的上传分页"></nav>
    </section>
    <section aria-labelledby="course-heading">
      <div class="section-heading">
        <h2 id="course-heading">全部课程</h2>
        <span id="course-count" class="muted"></span>
      </div>
      <form id="course-search-form" class="search-bar course-search-bar" role="search">
        <label class="sr-only" for="course-search-input">搜索课程</label>
        <input id="course-search-input" type="search" placeholder="搜索课程名、学院或学期" autocomplete="off">
        <button type="submit">搜索课程</button>
        <button id="course-search-reset" class="text-button" type="button" hidden>清除</button>
      </form>
      <div id="course-list" class="course-grid" aria-live="polite">
        <p class="state-message">正在加载课程...</p>
      </div>
      <nav id="course-pagination" class="pagination" aria-label="课程分页"></nav>
    </section>
  </main>
  <script src="/资源/脚本.js?v={{asset_version}}"></script>
</body>
</html>
